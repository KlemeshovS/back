<!DOCTYPE html>

<head>

                  <small data-i18n="storeLabel"></small>
                  <span>
                    <small data-i18n="badgeTop"></small>
                    <strong data-i18n="badgeBottom"></strong>
                  </span>
                </span>
              </a>
            </div>
            <div class="hint" data-i18n="hint"></div>
          </div>
        </div>

        <div class="phone-wrap">
          <div class="phone" aria-hidden="true">
            <div class="screen">
              <div class="icon">
                <div class="icon-mark"></div>
              </div>
              <h2>Wobbly</h2>
              <p data-i18n="screenBody"></p>
              <div class="mini-cards">
                <div class="mini-card">
                  <strong data-i18n="feature1Title"></strong>
                  <span data-i18n="feature1Body"></span>
                </div>
                <div class="mini-card">
                  <strong data-i18n="feature2Title"></strong>
                  <span data-i18n="feature2Body"></span>

            </div>

      </div>

      <section class="features">
        <article class="feature">
          <strong data-i18n="feature1Title"></strong>
          <p data-i18n="feature1Body"></p>
        </article>
        <article class="feature">
          <strong data-i18n="feature2Title"></strong>
          <p data-i18n="feature2Body"></p>
        </article>
        <article class="feature">
          <strong data-i18n="feature3Title"></strong>
          <p data-i18n="feature3Body"></p>
