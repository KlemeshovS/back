name: Staging Verify and Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: staging-pipeline
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff httpx

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Determine docs sync base ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "API_DOCS_BASE_REF=HEAD~1" >> "$GITHUB_ENV"
            echo "API_DOCS_HEAD_REF=HEAD" >> "$GITHUB_ENV"
          else
            echo "API_DOCS_BASE_REF=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "API_DOCS_HEAD_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Run project checks
        run: ./scripts/ci_check.sh

  deploy-staging:
    runs-on: ubuntu-latest
    needs:
      - verify

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server host key
        run: |
          ssh-keyscan -H "${{ secrets.STAGING_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy release to staging
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.STAGING_DEPLOY_SERVICE }}
          DEPLOY_OWNER: ${{ secrets.STAGING_DEPLOY_OWNER }}
          DEPLOY_VENV_PATH: ${{ secrets.STAGING_DEPLOY_VENV_PATH }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.STAGING_DEPLOY_HEALTHCHECK_URL }}
          SSH_KEY_PATH: /home/runner/.ssh/deploy_key
        run: ./scripts/deploy_release.sh

      - name: Smoke check staging URLs
        run: |
          curl -fsS -u "${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}" "${{ secrets.STAGING_PUBLIC_BASE_URL }}/health"
          curl -fsS -u "${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}" "${{ secrets.STAGING_PUBLIC_BASE_URL }}/api/docs" >/dev/null
          curl -fsS -u "${{ secrets.STAGING_BASIC_AUTH_USER }}:${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}" "${{ secrets.STAGING_PUBLIC_BASE_URL }}/api/swagger" >/dev/null
