[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = [
  "ignore:The 'alias' attribute with value .* was provided to the `Field\\(\\)` function:pydantic.warnings.UnsupportedFieldAttributeWarning",
  "ignore:The 'validation_alias' attribute with value .* was provided to the `Field\\(\\)` function:pydantic.warnings.UnsupportedFieldAttributeWarning",
  "ignore:The 'serialization_alias' attribute with value .* was provided to the `Field\\(\\)` function:pydantic.warnings.UnsupportedFieldAttributeWarning",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
  ".git",
  ".idea",
  ".venv",
  "frontend/node_modules",
  "backend/app/static/assets",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
