# Shared rate limit zones for api.wobbly.site.
# This file is meant to live in /etc/nginx/conf.d/ on the server.

limit_req_status 429;
limit_conn_status 429;

# Per-IP request rate for the public API entrypoint.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

# Per-IP concurrent connection cap.
limit_conn_zone $binary_remote_addr zone=api_conn_per_ip:10m;
